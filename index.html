<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Get Fired Up — Cold Call Mode</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #080808;
      color: #fff;
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    canvas {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    /* ── overlay scrim so text pops ── */
    .scrim {
      position: fixed;
      inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.55) 60%, rgba(0,0,0,0.80) 100%);
      z-index: 1;
      pointer-events: none;
    }

    .content {
      position: relative;
      z-index: 2;
      text-align: center;
      padding: 2rem 1.5rem;
      max-width: 700px;
      width: 100%;
    }

    /* ── headline ── */
    h1 {
      font-size: clamp(3.5rem, 14vw, 9rem);
      font-weight: 900;
      line-height: 0.95;
      letter-spacing: -0.02em;
      background: linear-gradient(170deg, #fff6e0 0%, #ffb347 45%, #ff4500 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: drop-shadow(0 0 40px rgba(255,100,0,0.55));
      animation: pulse 2.6s ease-in-out infinite;
    }
    @keyframes pulse {
      0%,100% { filter: drop-shadow(0 0 28px rgba(255,100,0,0.45)); }
      50%      { filter: drop-shadow(0 0 70px rgba(255,160,0,0.85)); }
    }

    .tagline {
      margin-top: 0.6rem;
      font-size: clamp(0.85rem, 2.5vw, 1.1rem);
      color: rgba(255, 200, 120, 0.8);
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    /* ── affirmation card ── */
    .affirmation {
      margin: 2rem auto 0;
      padding: 1.1rem 1.6rem;
      background: rgba(255, 80, 0, 0.1);
      border: 1px solid rgba(255, 100, 0, 0.35);
      border-radius: 8px;
      font-size: clamp(1.05rem, 3vw, 1.35rem);
      font-weight: 600;
      color: #ffe8c0;
      line-height: 1.4;
      min-height: 4rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.3s;
    }

    /* ── call counter ── */
    .stats {
      margin-top: 1.8rem;
      display: flex;
      gap: 1.5rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .stat {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      padding: 0.8rem 1.4rem;
      min-width: 90px;
    }

    .stat-value {
      font-size: 2rem;
      font-weight: 900;
      color: #ffb347;
      line-height: 1;
    }

    .stat-label {
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.5);
      margin-top: 0.3rem;
    }

    /* ── buttons ── */
    .actions {
      margin-top: 1.8rem;
      display: flex;
      gap: 0.75rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    button {
      padding: 0.7rem 1.8rem;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.2s;
    }
    button:active { transform: scale(0.97); }

    #btn-call {
      background: linear-gradient(135deg, #ff6a00, #ff3300);
      color: #fff;
      box-shadow: 0 0 20px rgba(255,80,0,0.45);
    }
    #btn-call:hover { box-shadow: 0 0 35px rgba(255,80,0,0.7); }

    #btn-next {
      background: rgba(255,255,255,0.08);
      color: rgba(255,210,140,0.9);
      border: 1px solid rgba(255,120,0,0.4);
    }
    #btn-next:hover { background: rgba(255,80,0,0.2); }

    #btn-reset {
      background: rgba(255,255,255,0.05);
      color: rgba(255,255,255,0.4);
      border: 1px solid rgba(255,255,255,0.1);
      font-size: 0.78rem;
    }
    #btn-reset:hover { background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.6); }
  </style>
</head>
<body>
  <canvas id="fire"></canvas>
  <div class="scrim"></div>

  <div class="content">
    <h1>FIRED UP</h1>
    <p class="tagline">Cold Call Mode &mdash; Let&rsquo;s Go</p>

    <div class="affirmation" id="affirmation">Loading&hellip;</div>

    <div class="stats">
      <div class="stat">
        <span class="stat-value" id="calls">0</span>
        <span class="stat-label">Calls Made</span>
      </div>
      <div class="stat">
        <span class="stat-value" id="streak">0</span>
        <span class="stat-label">Call Streak</span>
      </div>
    </div>

    <div class="actions">
      <button id="btn-call">&#128222; Log a Call</button>
      <button id="btn-next">New Mantra</button>
      <button id="btn-reset">Reset</button>
    </div>
  </div>

  <script>
    // ── Mantras ────────────────────────────────────────────────────────────
    const mantras = [
      "Every 'no' is one call closer to 'yes'.",
      "Pick up the phone. The next one could change everything.",
      "Rejection is redirection. Dial again.",
      "You don't close every call — you improve on every call.",
      "The person on the other end is waiting for a solution you have.",
      "Confidence is a skill. You're building it right now.",
      "One more call. That's all. Then one more.",
      "Your energy sets the tone. Bring fire.",
      "Champions dial when they don't feel like it.",
      "Volume beats luck. Make the calls.",
      "Every great closer was once where you are now.",
      "The phone is your superpower. Use it.",
      "Show up with energy and the right person will feel it.",
      "Objections are questions in disguise. Answer them.",
      "This call might be the one. You'll never know unless you dial.",
    ];

    let idx = Math.floor(Math.random() * mantras.length);
    function showMantra() {
      const el = document.getElementById('affirmation');
      el.style.opacity = 0;
      setTimeout(() => {
        el.textContent = mantras[idx % mantras.length];
        el.style.opacity = 1;
        idx++;
      }, 300);
    }
    showMantra();

    // ── Counter ────────────────────────────────────────────────────────────
    let calls = parseInt(localStorage.getItem('fc_calls') || '0');
    let streak = parseInt(localStorage.getItem('fc_streak') || '0');

    function updateDisplay() {
      document.getElementById('calls').textContent = calls;
      document.getElementById('streak').textContent = streak;
      localStorage.setItem('fc_calls', calls);
      localStorage.setItem('fc_streak', streak);
    }
    updateDisplay();

    document.getElementById('btn-call').addEventListener('click', () => {
      calls++;
      streak++;
      updateDisplay();
      showMantra();
      burst();
    });

    document.getElementById('btn-next').addEventListener('click', showMantra);

    document.getElementById('btn-reset').addEventListener('click', () => {
      if (!confirm('Reset your call count?')) return;
      calls = 0; streak = 0;
      updateDisplay();
    });

    // ── Fire simulation ────────────────────────────────────────────────────
    const canvas = document.getElementById('fire');
    const ctx = canvas.getContext('2d');
    const SCALE = 4;
    let W, H, heat;

    function resize() {
      W = Math.ceil(window.innerWidth / SCALE);
      H = Math.ceil(window.innerHeight / SCALE);
      canvas.width = W;
      canvas.height = H;
      canvas.style.width = window.innerWidth + 'px';
      canvas.style.height = window.innerHeight + 'px';
      heat = new Float32Array(W * H);
    }
    resize();
    window.addEventListener('resize', resize);

    function makepalette() {
      const pal = new Uint32Array(256);
      for (let i = 0; i < 256; i++) {
        let r, g, b;
        if (i < 64)       { r = i * 3;          g = 0;              b = 0; }
        else if (i < 128) { r = 192 + (i - 64); g = (i - 64) * 3;  b = 0; }
        else if (i < 192) { r = 255;             g = 192 + (i-128); b = (i-128)*2; }
        else              { r = 255;             g = 255;            b = 128 + (i-192)*2; }
        pal[i] = (255 << 24) | (Math.min(b,255) << 16) | (Math.min(g,255) << 8) | Math.min(r,255);
      }
      return pal;
    }
    const palette = makepalette();

    let extraHeat = 0;

    function igniteBase() {
      const base = 0.75 + Math.min(extraHeat, 0.25);
      for (let x = 0; x < W; x++) {
        const v = (Math.random() > 0.06 ? base + Math.random() * 0.25 : 0.3 + Math.random() * 0.3);
        heat[(H-1)*W+x] = Math.min(1, v);
        heat[(H-2)*W+x] = Math.min(1, v * 0.88);
      }
    }

    function step() {
      igniteBase();
      for (let y = 0; y < H-2; y++) {
        for (let x = 0; x < W; x++) {
          const xl = (x-1+W)%W, xr = (x+1)%W;
          const avg =
            heat[(y+1)*W+xl]*0.2 +
            heat[(y+1)*W+x] *0.4 +
            heat[(y+1)*W+xr]*0.2 +
            heat[(y+2)*W+x] *0.2;
          heat[y*W+x] = Math.max(0, avg - (0.010 + Math.random()*0.018));
        }
      }
      if (extraHeat > 0) extraHeat = Math.max(0, extraHeat - 0.003);
    }

    function draw() {
      const img = ctx.createImageData(W, H);
      const data = new Uint32Array(img.data.buffer);
      for (let i = 0; i < W*H; i++) {
        data[i] = palette[Math.min(255, Math.floor(heat[i]*255))];
      }
      ctx.putImageData(img, 0, 0);
    }

    function burst() {
      extraHeat = 1.0;
      for (let i = 0; i < 4; i++) igniteBase();
    }

    (function loop() { step(); draw(); requestAnimationFrame(loop); })();
  </script>
</body>
</html>
